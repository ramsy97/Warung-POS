<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Rounded square background like a real iOS/Android app icon -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Inner circular glow or design -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#iconGrad)" stroke-width="8" stroke-dasharray="10 15" opacity="0.15" />
  
  <!-- Storefront Icon with Modern/Sleek design -->
  <g transform="translate(112, 112) scale(1.15)" filter="url(#glow)">
    <!-- Roof / Awning -->
    <path d="M22 108 L234 108 L210 44 L46 44 Z" fill="url(#iconGrad)" />
    
    <!-- Roof stripes/shadows -->
    <path d="M58 44 L80 108 M102 44 L112 108 M148 44 L144 108 M192 44 L176 108" stroke="#ffffff" stroke-width="4" opacity="0.15" stroke-linecap="round" />
    
    <!-- Roof front bar -->
    <rect x="14" y="102" width="228" height="12" rx="6" fill="#ffffff" />
    
    <!-- Main Building Body -->
    <path d="M34 114h188v72a16 16 0 0 1-16 16H50a16 16 0 0 1-16-16v-72z" fill="#ffffff" fill-opacity="0.1" stroke="url(#iconGrad)" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Glass Door -->
    <path d="M102 202v-52a8 8 0 0 1 8-8h32a8 8 0 0 1 8 8v52" fill="none" stroke="url(#iconGrad)" stroke-width="8" stroke-linecap="round" />
    
    <!-- Windows -->
    <rect x="54" y="132" width="32" height="32" rx="6" fill="#ffffff" fill-opacity="0.15" />
    <rect x="170" y="132" width="32" height="32" rx="6" fill="#ffffff" fill-opacity="0.15" />
  </g>
</svg>